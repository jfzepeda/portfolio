name: Vercel Preview Deployment
permissions:
  contents: read
  pull-requests: write
on:
  pull_request:
    branches:
      - '**'

jobs:
  Linting:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Pull Vercel Environment Information
        run: npx vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      - name: Copy vercel env file
        run: cp .vercel/.env.preview.local .env
      - name: Run ESLint
        run: npm run lint -- --max-warnings 0

  Build:
    runs-on: ubuntu-latest
    needs: Linting
    strategy:
      matrix:
        node-version: [20]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Pull Vercel Environment Information
        run: npx vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      - name: Copy vercel env file
        run: cp .vercel/.env.preview.local .env
      - name: Build app
        run: npm run build

  Deploy-Preview:
    runs-on: ubuntu-latest
    needs: Build
    strategy:
      matrix:
        node-version: [20]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Pull Vercel Environment Information
        run: npx vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build Project Artifacts
        run: npx vercel build --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy Project Artifacts to Vercel
        id: deploy-vercel
        run: |
          echo "vercel_output=$(npx vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})" >> $GITHUB_OUTPUT
      - name: Comment on PR
        uses: thollander/actions-comment-pull-request@v2
        with:
          message: |
            Latest Preview URL: <a href="${{ join(steps.deploy-vercel.outputs.*, '\n') }}" target="_blank">${{ join(steps.deploy-vercel.outputs.*, '\n') }}</a>
          comment_tag: vercel-preview
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
